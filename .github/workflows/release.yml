# Release builds of enso for macOS (Apple silicon), Windows (x64, ARM64) and
# Linux (x64, ARM64).
#
# Run it by hand: Actions -> Release -> Run workflow. It builds every package
# and puts them in a draft GitHub Release for the version in Cargo.toml
# (v0.1.0 and so on), to check and publish from the Releases page. Running it
# again for the same version replaces the draft's files.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (Apple silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            macos/quicklook -> ../../target/quicklook
      # Release build, enso.app with its Quick Look extension, ad-hoc
      # signature and disk image. Not notarized: Gatekeeper asks on first open.
      - run: ./scripts/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: enso-macos-arm64
          path: target/enso-*.dmg
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      # build.rs embeds the app icon; .cargo/config.toml gives the main
      # thread the 8 MB stack GPUI needs.
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $dir = "enso-$version-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/enso.exe "$dir/enso.exe"
          Copy-Item README.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: enso-windows-${{ matrix.arch }}
          path: enso-*-windows-*.zip
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev \
            libvulkan-dev libssl-dev libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - run: cargo build --release --locked
      # The binary, its launcher icon and the script that installs both:
      # after unpacking, run ./install.sh (or sh install.sh) to add enso to
      # the app launcher.
      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          dir="enso-$version-linux-${{ matrix.arch }}"
          mkdir -p "$dir/assets" "$dir/scripts"
          cp target/release/enso "$dir/enso"
          cp -R assets/linux "$dir/assets/"
          cp scripts/install-linux.sh "$dir/scripts/"
          cat > "$dir/install.sh" <<'EOF'
          #!/bin/sh
          # Add enso to the app launcher, with its icon, for the current user.
          # Works as `sh install.sh` too: some archive tools unpack without
          # the executable bits, so they're restored here.
          here=$(cd "$(dirname "$0")" && pwd)
          chmod +x "$here/enso" "$here/scripts/install-linux.sh" "$here/install.sh" 2>/dev/null || true
          exec sh "$here/scripts/install-linux.sh" "$here/enso"
          EOF
          chmod +x "$dir/install.sh" "$dir/enso"
          cp README.md "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: enso-linux-${{ matrix.arch }}
          path: enso-*-linux-*.tar.gz
          if-no-files-found: error

  release:
    name: Draft release
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          tag="v$version"
          ls -l dist
          if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::$tag is already published. Bump the version in Cargo.toml for a new release."
              exit 1
            fi
            # Already drafted for this version: refresh its files.
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            # A draft: nothing is public, and the tag is only created on publish.
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "enso $tag" \
              --generate-notes
          fi
