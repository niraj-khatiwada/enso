[package]
name = "enso"
version = "1.0.0"
edition = "2024"
description = "A quiet, native Markdown workspace"
license = "MIT"

[dependencies]
dirs = "6.0.0"
futures = "0.3"
chrono = "0.4"
url = "2"
gpui-test = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"], optional = true }
gpui-kit = "0.8.1"
ropey = "=2.0.0-beta.1"
# Export: Markdown parsed as the reader parses it, HTML with its images, PDFs
# laid out by enso itself and written by krilla (text shaped by rustybuzz, in
# the system's fonts), and HTML on the clipboard for Copy as Rich Text.
markdown = "1.0.0"
base64 = "0.22"
# Already built for GPUI; scales large images down for Copy as Rich Text.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
arboard = { version = "3.7", default-features = false }
krilla = { version = "0.8.2", default-features = false, features = ["raster-images", "simple-text"] }
rustybuzz = "0.20.1"
fontdb = "0.23"
memmap2 = "0.9"
unicode-linebreak = "0.1.5"
# ```mermaid fences drawn as SVG: a pure-Rust port of Obsidian's Pele, no
# browser or JavaScript engine.
bezel-mermaid = "0.2.24"
# Pictures of diagrams for PDFs and the clipboard: the SVG renderer GPUI
# already builds, at its version and features.
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts"] }
# Web images: GPUI fetches them through an HTTP client the app installs.
# The system's TLS and trusted roots (Secure Transport, SChannel, OpenSSL),
# rather than a bundled TLS stack.
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }
bytes = "1"

# Moving deleted files to the Trash: the trash crate on macOS and Linux;
# Windows goes through the shell itself (see files::move_to_trash).
[build-dependencies]
# Embeds the app icon into enso.exe on Windows (build.rs).
embed-resource = "3"

[target.'cfg(not(windows))'.dependencies]
trash = "5"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8.9"
# Rich text on the clipboard under Wayland as well as X11.
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Globalization", "Win32_System_Com"] }
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage", "NSSpellChecker"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSString", "NSArray", "NSRange"] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
# Optimize for size and drop debug symbols: about a quarter smaller. Not
# `panic = "abort"`: GPUI and GPUI Kit catch panics internally.
opt-level = "s"
strip = true

# Upstream 0.3.10 uses unstable Option::map_or_default on macOS.
# Keep the supplied GPUI Kit version working with stable Rust.
[patch.crates-io]
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }

[features]
ui-tests = ["dep:gpui-test"]

# Keep the text engine fast during `cargo run`: building a million-line
# display index with unoptimized rope/tree iterators stalls the UI for seconds.
[profile.dev.package.gpui-base]
opt-level = 2

[profile.dev.package.ropey]
opt-level = 3

[profile.dev.package.gpui-pre-sum-tree]
opt-level = 3
